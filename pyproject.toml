[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pisama-auto"
version = "0.3.1"
description = "Zero-code auto-instrumentation for LLM applications with Pisama failure detection (compatibility shim over pisama.auto)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Pisama Team", email = "team@pisama.ai" }
]
keywords = [
    "ai", "agents", "monitoring", "auto-instrumentation",
    "opentelemetry", "observability", "llm"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
# As of 0.3.0 this package is a thin compatibility shim over `pisama.auto`
# (see CHANGELOG.md) -- the implementation, and its opentelemetry/wrapt
# dependencies, now live behind pisama's own `auto` extra. This depends on
# bare `pisama`, never on `pisama[auto]` or `pisama[agents]`: depending on an
# extra of the package this shim itself forwards to is the shape of a real
# dependency cycle, so it's out of bounds regardless of whether today's
# extras happen to avoid tripping it. Use the `auto` extra below (or
# `pisama[auto]` directly) to get a fully functional `init()`.
dependencies = [
    "pisama>=0.6.0",
]

[project.optional-dependencies]
# Passthrough to pisama's own `auto` extra (opentelemetry-api/sdk/otlp-http,
# wrapt) -- not a hard dependency (see above), but `pip install
# "pisama-auto[auto]"` is the fewest-surprises way to get a fully functional
# init(), matching what a bare `pip install pisama-auto` always did before
# 0.3.0. Equivalent to `pip install "pisama[auto]"` directly.
auto = [
    "pisama[auto]>=0.6.0",
]
dev = [
    # Self-referential extra (PEP 621 / pip >=21.2): pulls in the `auto`
    # extra above so `pip install -e ".[dev]"` alone is enough to run this
    # package's own test suite, without hand-listing opentelemetry/wrapt
    # a second time.
    "pisama-auto[auto]",
    "anthropic>=0.40",
    "build>=1.2",
    "openai>=1.50",
    "mypy>=1.8",
    "pytest>=7.4",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "twine>=5.0",
]

[project.urls]
Homepage = "https://pisama.ai"
Documentation = "https://docs.pisama.ai/auto-instrumentation"
Repository = "https://github.com/Pisama-AI/pisama-auto"
Issues = "https://github.com/Pisama-AI/pisama-auto/issues"
Changelog = "https://github.com/Pisama-AI/pisama-auto/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/pisama_auto"]

[tool.hatch.build.targets.sdist]
include = [
    "CHANGELOG.md",
    "CODE_OF_CONDUCT.md",
    "CONTRIBUTING.md",
    "LICENSE",
    "README.md",
    "SECURITY.md",
    "src",
    "tests",
]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
python_version = "3.10"
warn_unused_configs = true
check_untyped_defs = true
no_implicit_optional = true
# No per-module ignore_missing_imports overrides needed anymore: as a thin
# shim, src/pisama_auto no longer imports anthropic/openai/opentelemetry.*
# directly (those live in pisama.auto now, which ships its own py.typed).
# tests/ still exercises those SDKs directly but isn't mypy-checked here
# (only `mypy src/pisama_auto` runs in CI).
