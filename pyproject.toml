[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pisama-auto"
version = "0.2.0"
description = "Zero-code auto-instrumentation for LLM applications with Pisama failure detection"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Pisama Team", email = "team@pisama.ai" }
]
keywords = [
    "ai", "agents", "monitoring", "auto-instrumentation",
    "opentelemetry", "observability", "llm"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "opentelemetry-api>=1.44.0",
    "opentelemetry-sdk>=1.44.0",
    "opentelemetry-exporter-otlp-proto-http>=1.44.0",
    "wrapt>=2.2.2",
]

[project.optional-dependencies]
dev = [
    "anthropic>=0.120.0",
    "build>=1.5.0",
    "openai>=2.48.0",
    "mypy>=2.3.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.0",
    "twine>=6.2.0",
]

[project.urls]
Homepage = "https://pisama.ai"
Documentation = "https://docs.pisama.ai/auto-instrumentation"
Repository = "https://github.com/Pisama-AI/pisama-auto"
Issues = "https://github.com/Pisama-AI/pisama-auto/issues"
Changelog = "https://github.com/Pisama-AI/pisama-auto/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/pisama_auto"]

[tool.hatch.build.targets.sdist]
include = [
    "CHANGELOG.md",
    "CODE_OF_CONDUCT.md",
    "CONTRIBUTING.md",
    "LICENSE",
    "README.md",
    "SECURITY.md",
    "src",
    "tests",
]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
python_version = "3.10"
warn_unused_configs = true
check_untyped_defs = true
no_implicit_optional = true

[[tool.mypy.overrides]]
module = [
    "anthropic",
    "openai",
    "opentelemetry.exporter.otlp.proto.grpc.trace_exporter",
]
ignore_missing_imports = true
