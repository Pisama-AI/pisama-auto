[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pisama-auto"
version = "0.2.0"
description = "Zero-code auto-instrumentation for LLM applications — adds Pisama failure detection with one line"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Pisama Team", email = "team@pisama.ai" }
]
keywords = [
    "ai", "agents", "monitoring", "auto-instrumentation",
    "opentelemetry", "observability", "llm"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "opentelemetry-api>=1.20.0",
    "opentelemetry-sdk>=1.20.0",
    "opentelemetry-exporter-otlp-proto-http>=1.20.0",
    "wrapt>=1.15.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "ruff>=0.4",
]

[project.urls]
Homepage = "https://pisama.ai"
Documentation = "https://docs.pisama.ai/auto-instrumentation"
Repository = "https://github.com/Pisama-AI/pisama-auto"
Issues = "https://github.com/Pisama-AI/pisama-auto/issues"
Changelog = "https://github.com/Pisama-AI/pisama-auto/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/pisama_auto"]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
