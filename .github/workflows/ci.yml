name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check src/ tests/

      - name: Type check
        run: mypy src/pisama_auto

      - name: Test
        run: pytest tests/ -q --tb=short --cov=pisama_auto --cov-report=term --cov-fail-under=96

  smoke:
    name: Smoke test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package (bare -- no [auto] extra)
        run: |
          python -m pip install --upgrade pip
          pip install .

      - name: Import without the auto extra
        run: |
          python -c "
          # 0.3.0+: pisama-auto depends on bare pisama, not pisama[auto], so
          # this bare install has no opentelemetry/wrapt. That was already
          # true pre-0.3.0 for plain \`import pisama_auto\` and \`import
          # pisama_auto.patches\` (neither touches those libs at module
          # level, then or now) -- unchanged by the shim. Reaching into
          # \`pisama_auto._tracer\` or \`pisama_auto.patches.anthropic_patch\`/
          # \`.openai_patch\` specifically has always needed them (those
          # modules import opentelemetry/wrapt unconditionally); it just
          # used to be guaranteed by pisama-auto's own hard dependencies
          # instead of by the auto extra. That part is exercised below,
          # after installing the extra.
          import pisama_auto
          import pisama_auto.patches
          assert not pisama_auto.is_initialized()
          print('OK: pisama_auto and pisama_auto.patches import without the auto extra')
          "

      - name: Install the auto extra
        run: pip install ".[auto]"

      - name: Import and init
        run: |
          python -c "
          import pisama_auto
          from pisama_auto import _tracer
          from pisama_auto.patches import anthropic_patch, openai_patch
          pisama_auto.init(auto_patch=False)  # no libs installed; just verify tracer boots
          assert pisama_auto.is_initialized()
          print('OK: pisama_auto (incl. _tracer, patches.*) imports and initializes with the auto extra')
          "

  build:
    name: Build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install build + twine
        run: |
          python -m pip install --upgrade pip build twine

      - name: Build wheel and sdist
        run: python -m build

      - name: Twine check
        run: python -m twine check dist/*

      - name: Test the built wheel
        run: |
          python -m venv /tmp/wheel-smoke
          /tmp/wheel-smoke/bin/pip install --quiet dist/*.whl
          /tmp/wheel-smoke/bin/python -c "
          import re
          import pisama_auto
          from importlib.metadata import version

          # 0.3.0+: __version__ forwards pisama.auto's implementation version
          # (also what OTEL scope/resource metadata reports), which is
          # deliberately decoupled from this distribution's own release
          # version -- see CHANGELOG.md 0.3.0. Check the packaging side
          # (installed metadata matches what pyproject.toml declares) and
          # the forwarding side (__version__ really did come from
          # pisama.auto, not some stale/blank default) separately, instead
          # of asserting the two are equal.
          packaged = version('pisama-auto')
          declared = re.search(
              r'^version = \"(.*)\"', open('pyproject.toml').read(), re.MULTILINE
          ).group(1)
          assert packaged == declared, f'packaged {packaged} != pyproject.toml {declared}'

          import pisama.auto
          assert pisama_auto.__version__ == pisama.auto.__version__, (
              f'__version__ {pisama_auto.__version__} != pisama.auto.__version__ '
              f'{pisama.auto.__version__} -- forwarding is broken'
          )
          print('OK: distribution version', packaged, '| forwarded __version__', pisama_auto.__version__)
          "
